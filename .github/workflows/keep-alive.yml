# Supabase pauses a free project after about a week without activity.
# This asks the API for the player count twice a day, which runs a real query
# against the database and so counts as activity. It also wakes the Render API.
name: Keep database awake

on:
  schedule:
    # 06:17 and 18:17 UTC. Off the hour, when GitHub's scheduler is less busy.
    - cron: "17 6,18 * * *"
  # Lets the job be run by hand from the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the API
        # Render's free plan can take a minute to wake, so failures are retried.
        # A response other than 200 fails the job, and GitHub emails the repo owner.
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
            https://playstate-api.onrender.com/api/stats
